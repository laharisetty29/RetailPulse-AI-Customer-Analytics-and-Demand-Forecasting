apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailpulse-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: retailpulse

  template:
    metadata:
      labels:
        app: retailpulse

    spec:
      containers:
      - name: retailpulse
        image: retailpulse:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8501